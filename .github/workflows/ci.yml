# SOPET Admin CI
# Lite (format + lint): PRs whose base is NOT deploy/production or deploy/uat
# Full (format + type-check + test + build + e2e): PRs targeting deploy/production or deploy/uat

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lite:
    if: github.base_ref != 'deploy/production' && github.base_ref != 'deploy/uat'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout admin
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit critical dependencies
        # Yarn classic exits with a severity bitmask; only fail on Critical (16).
        run: |
          set +e
          yarn audit --level critical
          code=$?
          set -e
          if (( code & 16 )); then exit 1; fi
          exit 0

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

  full:
    if: github.base_ref == 'deploy/production' || github.base_ref == 'deploy/uat'
    runs-on: ubuntu-latest

    env:
      # Same-origin BFF. An absolute backend URL is blocked by CSP connect-src 'self'
      # and skips HttpOnly auth cookies, which breaks Playwright GraphQL mocks.
      NEXT_PUBLIC_GRAPHQL_URL: /graphql
      GRAPHQL_SCHEMA_PATH: sopet-backend/src/schema.gql

    steps:
      - name: Checkout admin
        uses: actions/checkout@v4

      - name: Checkout backend schema
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/new-sopet-backend
          path: sopet-backend
          sparse-checkout: |
            src/schema.gql
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit critical dependencies
        # Yarn classic exits with a severity bitmask; only fail on Critical (16).
        run: |
          set +e
          yarn audit --level critical
          code=$?
          set -e
          if (( code & 16 )); then exit 1; fi
          exit 0

      - name: Format check
        run: yarn format:check

      - name: Type check
        run: yarn type-check

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: yarn test:e2e
