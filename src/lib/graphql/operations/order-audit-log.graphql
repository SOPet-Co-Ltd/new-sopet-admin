query OrderAuditLog($orderId: String!, $storeId: String!) {
  orderAuditLog(orderId: $orderId, storeId: $storeId) {
    orderId
    entries {
      id
      orderId
      eventType
      occurredAt
      actorType
      actorId
      actorLabel
      storeId
      details {
        paymentMethod
        previousPaymentMethod
        newPaymentMethod
        approvalMethod
        note
        storeId
      }
    }
  }
}
