fragment PromotionFields on PromotionType {
  id
  storeId
  code
  name
  description
  type
  scope
  discountValue
  minPurchaseAmount
  maxDiscountAmount
  usageLimit
  usagePerCustomer
  usageCount
  isActive
  autoApply
  priority
  conditions
  startsAt
  expiresAt
  createdAt
}

query Promotion($id: String!) {
  promotion(id: $id) {
    ...PromotionFields
  }
}

query StorePromotions($storeId: String!, $page: Int!, $limit: Int!) {
  storePromotions(storeId: $storeId, page: $page, limit: $limit) {
    items {
      ...PromotionFields
    }
    pagination {
      page
      limit
      total
      totalPages
    }
  }
}
